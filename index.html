<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coline Zaiko</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica o tema salvo antes de desenhar a tela (evita "piscar" claro→escuro).
    try {
      var tema = localStorage.getItem('zaiko-tema');
      if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Menu principal">
      <div class="marca" aria-hidden="true">在庫</div>
      <a href="#/inicio" data-rota="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Início</span>
      </a>
      <a href="#/vender" data-rota="vender">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span>Vender</span>
      </a>
      <a href="#/vendas" data-rota="vendas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
        <span>Vendas</span>
      </a>
      <a href="#/caixa" data-rota="caixa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>Caixa</span>
      </a>
      <a href="#/produtos" data-rota="produtos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13 13 20a1.5 1.5 0 0 1-2 0L3 12V4h8l9 9a1.5 1.5 0 0 1 0 0z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        <span>Produtos</span>
      </a>
      <a href="#/mais" data-rota="mais">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>Mais</span>
      </a>
    </nav>

    <main id="tela" class="tela" tabindex="-1"></main>
  </div>

  <div id="avisos" class="avisos" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
